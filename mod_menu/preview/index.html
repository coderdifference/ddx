<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDX Mod Menu — interaction preview</title>
<style>
:root{color-scheme:dark;font:16px Georgia,serif;background:#121314;color:#ded6c8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-content:center;gap:20px}header{width:min(960px,96vw);display:flex;justify-content:space-between;align-items:center;font:14px system-ui}button,select,input{font:inherit;color:inherit;background:#252526;border:1px solid #656057;border-radius:3px;padding:10px}button{cursor:pointer}button:hover,button[aria-current=true]{background:#493c29;border-color:#c1a76a}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d7bb74;outline-offset:3px}button:disabled{opacity:.4;cursor:default}#dialog{width:min(960px,96vw);height:min(640px,80vh);border:2px solid #7a6746;background:#1c1c1d;box-shadow:0 20px 80px #0009;display:flex;flex-direction:column}h1{font-size:26px;margin:0;padding:22px 26px;border-bottom:1px solid #574a34;color:#d8bd7d}#panels{display:grid;grid-template-columns:260px 1fr;min-height:0;flex:1}nav{border-right:1px solid #574a34;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}main{min-width:0;overflow:auto;padding:24px 30px}nav button{text-align:left}fieldset{border:0;border-bottom:1px solid #454039;padding:0 0 22px;margin:0 0 22px}legend{padding:0;margin-bottom:12px;font-size:18px;color:#dfc994}input[type=text],input[type=number],select{width:100%;font:15px system-ui}select[multiple]{min-height:120px}fieldset label{display:flex;align-items:center;gap:8px;margin:9px 0;font:15px system-ui}footer{display:flex;gap:12px;align-items:center;border-top:1px solid #574a34;padding:16px 24px;min-height:73px}#status{flex:1;font:14px system-ui;color:#e3be7a}#pause{display:none;text-align:center}#pause button{display:block;margin:12px auto;width:240px}.notice{font:13px system-ui;color:#b5afa4;max-width:960px}#dialog[hidden]{display:none}@media(max-width:650px){#panels{grid-template-columns:180px 1fr}main{padding:16px}header{gap:12px}}
</style>
<header><span>DDX · Campaign configuration</span><label>Preview campaign <select id="campaign"><option>Estate A</option><option>Estate B</option></select></label><button id="pauseButton">Pause campaign</button></header>
<section id="pause"><h2>Paused</h2><button id="options">Mod Options</button><button id="resume">Resume</button></section>
<section id="dialog" role="dialog" aria-modal="true" aria-labelledby="heading" hidden><h1 id="heading">Mod Options</h1><div id="panels"><nav aria-label="Configurable mods" id="mods"></nav><main><form id="fields"></form></main></div><footer><span id="status" role="status"></span><button id="close">Back</button><button id="save" disabled>Save</button></footer></section>
<p class="notice">Interactive development preview · Uses the C# controller. Saves are simulated in server memory per estate. The native game dialog is built into DDX; this preview simulates campaign storage.</p>
<script>
const $=id=>document.getElementById(id);let state,token='Estate A',paused=false,busy=false;
async function send(event,extra={}){const r=await fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event,campaign:token,...extra})});if(!r.ok)throw Error('Preview server failed');return r.json()}
function status(text){$('status').textContent=text||''}
function render(s){state=s;$('dialog').hidden=!s.open;$('pause').style.display=paused&&!s.open?'block':'none';$('save').disabled=!s.canSave;$('mods').replaceChildren();$('fields').replaceChildren();status(s.error);
for(const mod of s.mods){const b=document.createElement('button');b.textContent=mod.title;b.setAttribute('aria-current',String(mod.id===s.selected));b.onclick=async()=>{if(busy)return;render(await send('select',{mod:mod.id}));document.querySelector('main').scrollTop=0};$('mods').append(b)}
if(!s.schema)return;
for(const f of s.schema.fields){const group=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=f.label;group.append(legend);group.dataset.field=f.id;group.dataset.type=f.type;const value=s.values[f.id];
if(f.type==='enum'){for(const c of f.choices){const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name=f.id;input.value=c.id;input.checked=c.id===value;label.append(input,document.createTextNode(c.label));group.append(label)}}else{let input;if(f.type==='single'||f.type==='multi'){input=document.createElement('select');input.multiple=f.type==='multi';for(const c of f.choices){const option=document.createElement('option');option.value=c.id;option.textContent=c.label;option.selected=input.multiple?value.includes(c.id):value===c.id;input.append(option)}}else{input=document.createElement('input');input.type=f.type==='text'?'text':'number';if(f.type==='integer')input.step='1';if(f.type==='float')input.step='any';if(f.min!==undefined)input.min=f.min;if(f.max!==undefined)input.max=f.max;if(f.maxLength!==undefined)input.maxLength=f.maxLength;input.value=value;input.required=f.type!=='text'}input.setAttribute('aria-label',f.label);group.append(input)}$('fields').append(group)} }
$('save').onclick=async()=>{if(busy||!$('fields').reportValidity())return;busy=true;$('save').disabled=true;try{for(const group of $('fields').children){let value;const type=group.dataset.type;if(type==='enum')value=group.querySelector(':checked').value;else if(type==='multi')value=[...group.querySelector('select').selectedOptions].map(o=>o.value);else{value=group.querySelector('input,select').value;if(type==='integer'||type==='float')value=Number(value)}const result=await send('edit',{field:group.dataset.field,value});if(result.error){status(result.error);return}}const result=await send('save');state=result;status(result.error||'Saved to this campaign.')}catch(e){status(e.message)}finally{busy=false;$('save').disabled=!state.canSave}};
$('fields').onsubmit=e=>e.preventDefault();
$('options').onclick=async()=>{render(await send('open',{paused:true}));$('close').focus()};
$('close').onclick=async()=>{if(!busy){render(await send('close'));$('options').focus()}};
$('pauseButton').onclick=()=>{paused=true;$('pause').style.display='block';$('pauseButton').disabled=true};
$('resume').onclick=()=>{paused=false;$('pause').style.display='none';$('pauseButton').disabled=false};
$('campaign').onchange=async()=>{if(busy)return;await send('unload');token=$('campaign').value;paused=false;render(await send('load'));$('pauseButton').disabled=false};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy){if(state?.open)$('close').click();else if(paused)$('resume').click();else $('pauseButton').click()}});
(async()=>{render(await send('load'))})().catch(e=>status(e.message));
</script></html>
